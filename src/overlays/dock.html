<style>
@font-face { font-family: "Onest"; src: url("/assets/fonts/onest.woff2") format("woff2"); font-weight: 100 900; }
:root { color-scheme: dark; --bg: #1C1D22; --s1: rgba(255,255,255,.055); --s2: rgba(255,255,255,.1); --text: #F2F0EA; --mute: #AFACA4; --faint: #86837C; --ice: #FFB224; --red: #FF4D5E; --size: 14px; }

#form { display: flex; gap: 6px; } #text { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border: 0; border-radius: 18px; background: var(--s1); outline: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); } #text:focus { box-shadow: inset 0 0 0 1.5px var(--ice); }

#notice { flex: none; margin: 0 8px 6px; padding: 6px 10px; border-radius: 10px; background: rgba(240,180,41,.12); color: #F5D58A; font-size: 12px; line-height: 1.35; } #notice:empty { display: none; }
.empty { margin: auto; padding: 20px; text-align: center; color: var(--faint); }

.mod-btn { position: absolute; right: 3px; top: 2px; width: 26px; height: 22px; border-radius: 6px; color: var(--mute); font-weight: 800; letter-spacing: 1px; line-height: 1; opacity: 0; }
.m:hover .mod-btn, .m:focus-within .mod-btn, .m.open .mod-btn { opacity: 1; } .mod-btn:hover, .m.open .mod-btn { background: var(--s2); color: var(--text); }

.x { flex: none; margin-left: auto; width: 26px; height: 26px; border-radius: 50%; color: var(--mute); font-size: 17px; line-height: 1; } .x:hover { background: var(--s2); color: var(--text); }
.bl { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid rgba(255,255,255,.06); font-size: 12.5px; } .bl:first-of-type { border-top: 0; }
.bl .p { width: 7px; height: 7px; border-radius: 50%; flex: none; } .bl span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bl small { color: var(--faint); }
.bl button { flex: none; height: 24px; padding: 0 9px; border-radius: 7px; background: var(--s2); font-size: 12px; font-weight: 600; }
.bl .nm { flex: 1; min-width: 0; height: auto; padding: 0; background: none; text-align: left; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bl .nm:hover { text-decoration: underline; }
/* Repères : premier message, habitué, gros soutien */

.m .tg.new { background: var(--ice); color: #211700; } .m .tg.regular { background: rgba(62,220,142,.18); color: #8FE9BC; } .m .tg.fan { background: rgba(255,210,74,.18); color: #FFD979; }
.m.first { box-shadow: inset 3px 0 0 var(--ice); background: rgba(255,178,36,.06); }
/* Fiche spectateur */

.vc-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--mute); font-size: 12px; } .vc-sub i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
.vc-role { padding: 0 6px; border-radius: 5px; background: var(--s2); color: var(--text); font-size: 11px; font-weight: 700; }

.cs-row select { height: 28px; max-width: 58%; padding: 0 6px; border: 0; border-radius: 8px; background: var(--s2); font-size: 12px; }
.sw { flex: none; position: relative; width: 36px; height: 20px; border-radius: 10px; background: var(--s2); } .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--mute); transition: transform .15s; }
.sw[aria-pressed="true"] { background: var(--ice); } .sw[aria-pressed="true"]::after { transform: translateX(16px); background: #211700; }
.cs-clear { margin-top: 6px; height: 28px; padding: 0 12px; border-radius: 8px; background: rgba(255,77,94,.16); color: #FF9AA8; font-size: 12px; font-weight: 600; } .cs-clear.sure { background: var(--red); color: #fff; }

#spot { flex: none; display: flex; align-items: center; gap: 8px; margin: 0 8px 6px; padding: 4px 4px 4px 10px; border-radius: 10px; background: rgba(255,178,36,.13); color: #F5D58A; font-size: 12px; } #spot[hidden] { display: none; }
#spot span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #spot b { color: var(--text); font-weight: 700; }
#spot button { flex: none; height: 26px; padding: 0 10px; border-radius: 7px; background: rgba(255,255,255,.1); color: var(--text); font-size: 12px; font-weight: 600; } #spot button:hover { background: rgba(255,255,255,.16); }
.tool { position: relative; display: grid; place-items: center; } .tool svg { width: 15px; height: 15px; }
.tool .n { position: absolute; top: 0; right: -2px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--red, #E5484D); color: #fff; font-size: 9.5px; font-weight: 700; line-height: 14px; text-align: center; }
</style>
</head>

  document.title = t('Chat unifié');

// Texte avec les emotes TikTok insérées à leur place.
function rich(text, emotes) {
  const frag = document.createDocumentFragment();
  const chars = Array.from(String(text || ''));
  const list = (emotes || []).filter((x) => x && x.url).slice().sort((a, b) => (a.i || 0) - (b.i || 0));
  let at = 0;
  for (const x of list) {

  f.textContent = '';
  const list = items.filter(showable).slice(-300);
  for (const e of list) f.append(row(e));
  if (!list.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = t('Les messages de tes chaînes arriveront ici.'); f.append(p); }
  toEnd();
}

function add(e) {
  if (!['chat', ...Object.keys(TEXT)].includes(e.type)) return;
  if (e.id && items.some((x) => x.id === e.id)) return;
  items.push(e);
  if (items.length > 600) items.shift();
  if (!showable(e)) return;
  const f = $('feed');
  const keep = stuck();
  f.querySelector('.empty')?.remove();
  f.append(row(e));
  while (f.children.length > 300) f.firstChild.remove();
  if (keep) toEnd(); else $('more').hidden = false;
}

// La traduction arrive après le message : on complète la ligne déjà affichée.
function patch(d) {
  const e = items.find((i) => i.id === d.id);
  if (!e) return;
  e.translation = d.translation;
  if (d.mode) tr.mode = d.mode;
  if (d.showLang !== undefined) tr.showLang = d.showLang;
  if (!tr.enabled) { tr.enabled = true; tabs(); }
  if (!showTr) return;
  const old = $('feed').querySelector(`.m[data-id="${CSS.escape(d.id)}"]`);
  if (!old) return;
  const keep = stuck();
  old.replaceWith(row(e));
  if (keep) toEnd();
}

function tabs() {
  const head = $('tabs');
  head.textContent = '';
  const h = document.createElement('div'); h.className = 'tabs'; h.setAttribute('role', 'tablist'); h.setAttribute('aria-label', t('Plateformes'));
  const box = document.createElement('div'); box.className = 'tools';
  head.append(h, box);
  const ps = [...new Set(targets.map((c) => c.platform))];
  for (const [id, label] of [['all', t('Tout')], ...ps.map((p) => [p, NAMES[p]])]) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = `tab${filter === id ? ' on' : ''}`; b.textContent = label; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', filter === id);
    b.onclick = () => { filter = id; tabs(); redraw(); };
    h.append(b);
  }
  const tool = (txt, label, on, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = `tool${on ? ' on' : ''}`; b.textContent = txt; b.title = label; b.setAttribute('aria-label', label); b.onclick = fn; box.append(b); };
  tool(lang === 'en' ? 'E' : 'É', t(events ? 'Masquer les événements' : 'Afficher les événements'), events, () => { events = !events; try { localStorage.setItem('dockEvents', events ? '1' : '0'); } catch { /* facultatif */ } tabs(); redraw(); });
  if (tr.enabled) tool('文', t(showTr ? 'Masquer les traductions' : 'Afficher les traductions'), showTr, () => { showTr = !showTr; try { localStorage.setItem('dockTr', showTr ? '1' : '0'); } catch { /* facultatif */ } tabs(); redraw(); });
  tool('', t('Réglages du chat'), sheet === 'chat', () => { if (sheet === 'chat') closeSheet(); else openChat(); });
  box.lastChild.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h6M12 4.5h1.5M2.5 11.5H4M7.5 11.5h6"/><circle cx="10.2" cy="4.5" r="1.7"/><circle cx="5.8" cy="11.5" r="1.7"/></svg>';
  const nb = (mod.blocked || []).length;
  tool('', t('Spectateurs bloqués') + (nb ? ` (${nb})` : ''), sheet === 'blocked', () => { if (sheet === 'blocked') closeSheet(); else openSheet('blocked'); });
  const bb = box.lastChild; bb.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M3.7 12.3l8.6-8.6"/></svg>';
  if (nb) { const n = document.createElement('span'); n.className = 'n'; n.textContent = nb > 99 ? '99+' : String(nb); bb.append(n); }
  tool('A−', t('Réduire le texte'), false, () => zoom(-1));
  tool('A+', t('Agrandir le texte'), false, () => zoom(1));
}
function zoom(d) { size = Math.min(22, Math.max(11, size + d)); document.documentElement.style.setProperty('--size', `${size}px`); try { localStorage.setItem('dockSize', size); } catch { /* facultatif */ } }

function fillTargets() {
  const sel = $('target');
  const keep = sel.value;
  sel.textContent = '';
  const usable = targets.filter((c) => c.canSend);
  if (usable.length > 1 && canAll) sel.append(new Option(t('Toutes mes chaînes'), 'all'));
  for (const c of usable) sel.append(new Option(`${NAMES[c.platform] || c.platform} : ${c.label}`, c.id));
  // Les chaînes qui ne peuvent pas encore écrire restent visibles, grisées, avec la raison au survol.
  for (const c of targets.filter((x) => !x.canSend)) {
    const o = new Option(`${NAMES[c.platform] || c.platform} : ${c.label} (${t('à connecter')})`, c.id);
    o.disabled = true;
    o.title = c.hint || '';
    sel.append(o);
  }
  if (!usable.length) sel.prepend(new Option(t('Aucune chaîne ne peut écrire pour le moment'), ''));
  if ([...sel.options].some((o) => o.value === keep && !o.disabled)) sel.value = keep;
  else if (!keep && usable.length > 1 && canAll) sel.value = 'all';
  else if (usable.length) sel.value = sel.querySelector('option:not([disabled])')?.value || '';
  $('send').disabled = !usable.length;
  $('text').disabled = !usable.length;
  $('text').placeholder = t(usable.length ? 'Écrire dans le chat' : 'Connecte une chaîne pour écrire ici');
  $('err').textContent = usable.length ? $('err').textContent : (targets.find((c) => c.hint)?.hint || '');
}

async function state(first) {
  try {
    const d = await (await fetch(q('/dock/state'))).json();
    targets = d.targets; canAll = d.all;
    const relang = (d.lang === 'en' ? 'en' : 'fr') !== lang;
    const retr = d.tr && (d.tr.enabled !== tr.enabled || d.tr.mode !== tr.mode || d.tr.showLang !== tr.showLang);
    lang = d.lang === 'en' ? 'en' : 'fr';
    if (d.tr) tr = d.tr;
    if (first || relang) staticLabels();
    $('notice').textContent = d.notice ? t(d.notice) : '';
    if (d.mod) { mod = d.mod; if (sheet === 'blocked') renderSheet(); }
    if ('spot' in d && (d.spot?.id !== spot?.id || !d.spot)) { spot = d.spot; spotBar(); }
    // Rattrapage : les messages que Régie a reçus mais que le dock n'a pas eus (coupure de quelques
    // secondes, OBS qui recharge le dock) sont remis à leur place, dans l'ordre.
    const have = new Set(items.map((e) => e.id));
    const missed = (d.feed || []).filter((e) => e.id && !have.has(e.id));
    if (missed.length) { items.push(...missed); items.sort((a, b) => (a.ts || 0) - (b.ts || 0)); while (items.length > 600) items.shift(); }
    if (first || missed.length || relang || retr) redraw();
    tabs(); fillTargets();
  } catch { /* réessai au prochain passage */ }
}

let opened = false;
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws?k=${encodeURIComponent(k)}&dock=1`);
  // À la reconnexion, on récupère tout de suite ce qui est arrivé pendant la coupure.
  ws.onopen = () => { if (opened) state(false); opened = true; };
  ws.onmessage = (m) => { const d = JSON.parse(m.data); if (d.t === 'ev') add(d.ev); else if (d.t === 'evx') patch(d); else if (d.t === 'evdel') drop(d.ids); };
  ws.onclose = () => setTimeout(connect, 2000);
}

$('feed').addEventListener('scroll', () => { if (stuck()) $('more').hidden = true; });
$('more').onclick = toEnd;
addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeMod(); if (sheet) closeSheet(); } });
$('form').onsubmit = async (e) => {
  e.preventDefault();
  const box = $('text');
  const msg = box.value.trim();
  if (!msg) return;
  $('send').disabled = true;
  const r = await fetch(q('/dock/send'), { method: 'POST', body: JSON.stringify({ text: msg, target: $('target').value }) }).then((x) => x.json()).catch(() => ({ ok: false, error: t('Régie ne répond pas.') }));
  $('send').disabled = false;
  if (r.ok) {
    box.value = '';
    $('err').textContent = (r.failed || []).map((f) => `${NAMES[f.platform] || f.platform} : ${f.error}`).join(' · ');
  } else $('err').textContent = r.error || '';
  box.focus();
};
state(true);
setInterval(() => state(false), 10000);
connect();
</script>
</body>
</html>
