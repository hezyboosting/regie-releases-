# Compilation à la demande, sans publier : l'installateur est téléchargeable dans l'onglet Actions.
name: Fabriquer le .exe
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: regie-windows
          path: dist/*.exe
