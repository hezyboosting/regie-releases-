# Publie Régie à chaque envoi sur main : tests, compilation sur Windows, puis release GitHub
# avec latest.yml (c'est ce fichier que les applis installées lisent pour se mettre à jour).
name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Si cette version est déjà publiée, on monte le dernier chiffre (2.14.0 → 2.14.1).
      - name: Version
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            npm version patch --no-git-tag-version
            V=$(node -p "require('./package.json').version")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "v$V"
            git push origin HEAD:main
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version publiée : $V"

      - run: npm ci --ignore-scripts

      - name: Compiler et publier
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ steps.ver.outputs.version }}" in *-*) export EP_PRE_RELEASE=true ;; esac
          npx electron-builder --win --x64 --publish always
